<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- The panel is entirely local: no remote script, style, image or fetch. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>claude-usage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow: hidden; }

    /* Author display rules below would otherwise beat the browser's own [hidden] rule. */
    [hidden] { display: none !important; }

    body {
      width: 320px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      border: 1px solid #e5e2de;
      border-radius: 10px;
      user-select: none;
      /* Frameless window: the whole panel is a drag handle, except its controls. */
      -webkit-app-region: drag;
    }

    button { -webkit-app-region: no-drag; }

    /* Top line of the card: last reading on the left, controls on the right */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: -3px -5px -2px 0;
    }

    .headline {
      font-size: 10.5px;
      color: #8b8580;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 5px;
      background: none;
      color: #b0aca6;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: #f0eeeb; color: #1a1a1a; }
    .icon-btn.danger:hover { color: #d94444; }

    .icon-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn.spinning { color: #d97757; }
    .icon-btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Content */
    .content {
      padding: 7px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Gauges — spacing comes from the .account block that holds them */
    .gauge { display: flex; flex-direction: column; gap: 1px; line-height: 1.25; }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gauge-label { font-size: 10.5px; font-weight: 500; color: #5c5650; }
    .gauge-reset { font-size: 9.5px; color: #b0aca6; }

    .gauge-row { display: flex; align-items: center; gap: 8px; }

    .gauge-track {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #f0eeeb;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .gauge-value {
      font-size: 10.5px;
      font-weight: 600;
      min-width: 30px;
      text-align: right;
    }

    .gauges-empty {
      font-size: 11px;
      color: #b0aca6;
      text-align: center;
      padding: 6px 0;
    }

    /* Accounts */
    #account-list { display: flex; flex-direction: column; gap: 6px; }

    .account { display: flex; flex-direction: column; gap: 5px; }

    /* Separator between stacked accounts, never above the first one */
    .account + .account { padding-top: 6px; border-top: 1px solid #f0eeeb; }

    /* A row, not a button: the remove button lives on it, and a button cannot
       be nested inside another one. */
    .account-head { display: flex; align-items: center; gap: 6px; }

    .account-switch {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0; /* lets the name ellipsis instead of pushing the button out */
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      text-align: left;
      cursor: default;
    }

    /* Only a block you can switch to invites a click. */
    .account-switch[data-action] { cursor: pointer; }

    .account-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ddd9d4;
      flex-shrink: 0;
    }

    .account.active .account-dot { background: #d97757; }

    .account-name {
      font-size: 11px;
      font-weight: 600;
      color: #5c5650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-switch[data-action]:hover .account-name { color: #1a1a1a; }

    .account-summary {
      margin-left: auto;
      font-size: 10px;
      color: #b0aca6;
      white-space: nowrap;
      flex-shrink: 0;
      padding-left: 6px;
    }

    .account-remove {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      border-radius: 5px;
      background: none;
      color: #ccc7c1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .account-remove:hover { background: #fceeed; color: #d94444; }

    .account-remove svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Status pill — only shown when something needs the user */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #f0eeeb;
    }

    .status-bar.error { background: #fceeed; }
    .status-bar.login { background: #fef4e8; }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .status-bar.error .status-dot { background: #d94444; }
    .status-bar.login .status-dot { background: #d9952a; }

    .status-text {
      font-size: 12px;
      color: #5c5650;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    /* Delivery line */
    .delivery {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: #8b8580;
      padding: 0 2px;
      overflow-wrap: anywhere;
    }

    .delivery-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .delivery.ok .delivery-dot { background: #4a9e4a; }
    .delivery.error { color: #c0483f; }
    .delivery.error .delivery-dot { background: #d94444; }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      border: 1px solid #ddd9d4;
      background: #fff;
      color: #5c5650;
    }

    .btn-secondary:hover { border-color: #d97757; color: #d97757; }

    .btn svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer */
    .footer-links {
      display: flex;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid #f0eeeb;
    }

    .link {
      color: #b0aca6;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 10.5px;
      padding: 0;
    }

    .link:hover { color: #1a1a1a; }
    .link.danger:hover { color: #d94444; }
  </style>
</head>
<body>
  <div class="content">
    <div class="card-head">
      <span class="headline" id="headline"></span>
      <div class="header-actions">
        <button id="settings-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="sync-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button id="minimize-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- One block per account, built by panel.js: the status pill, the reconnect
         button and the delivery line all live inside the block they belong to. -->
    <div id="account-list"></div>

    <div class="footer-links">
      <button class="link" id="add-account-btn"></button>
      <button class="link" id="quit-btn"></button>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
