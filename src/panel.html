<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- The panel is entirely local: no remote script, style, image or fetch. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>claude-usage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow: hidden; }

    body {
      width: 320px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #faf9f7;
      border: 1px solid #e5e2de;
      border-radius: 10px;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #ebe8e4;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      background: #d97757;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg { width: 14px; height: 14px; fill: #fff; }

    .header-text { display: flex; flex-direction: column; gap: 1px; }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-subtitle { font-size: 11px; color: #8b8580; }

    /* Content */
    .content {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Gauges */
    .gauges {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #ebe8e4;
      border-radius: 10px;
    }

    .gauges-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b8580;
    }

    .gauge { display: flex; flex-direction: column; gap: 3px; }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gauge-label { font-size: 11px; font-weight: 500; color: #5c5650; }
    .gauge-reset { font-size: 9.5px; color: #b0aca6; }

    .gauge-row { display: flex; align-items: center; gap: 8px; }

    .gauge-track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #f0eeeb;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .gauge-value {
      font-size: 11px;
      font-weight: 600;
      min-width: 30px;
      text-align: right;
    }

    .gauges-empty {
      font-size: 11px;
      color: #b0aca6;
      text-align: center;
      padding: 6px 0;
    }

    /* Status pill */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #f0eeeb;
      transition: background 0.2s;
    }

    .status-bar.ok { background: #eef6ee; }
    .status-bar.error { background: #fceeed; }
    .status-bar.syncing { background: #fef4e8; }
    .status-bar.login { background: #fef4e8; }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .status-bar.ok .status-dot { background: #4a9e4a; }
    .status-bar.error .status-dot { background: #d94444; }
    .status-bar.syncing .status-dot { background: #d9952a; }
    .status-bar.login .status-dot { background: #d9952a; }

    .status-text {
      font-size: 12px;
      color: #5c5650;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    /* Delivery line */
    .delivery {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: #8b8580;
      padding: 0 2px;
      overflow-wrap: anywhere;
    }

    .delivery-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .delivery.ok .delivery-dot { background: #4a9e4a; }
    .delivery.error { color: #c0483f; }
    .delivery.error .delivery-dot { background: #d94444; }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      border: none;
      background: #d97757;
      color: #fff;
      font-size: 13px;
    }

    .btn-primary:hover { background: #c96a4d; }

    .btn-secondary {
      border: 1px solid #ddd9d4;
      background: #fff;
      color: #5c5650;
    }

    .btn-secondary:hover { border-color: #d97757; color: #d97757; }

    .btn svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer */
    .footer {
      border-top: 1px solid #ebe8e4;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .path-line {
      font-size: 10px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: #8b8580;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .path-line:hover { color: #d97757; }

    .footer-links {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .link {
      color: #8b8580;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      padding: 0;
    }

    .link:hover { color: #1a1a1a; }
    .link.danger:hover { color: #d94444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
    </div>
    <div class="header-text">
      <div class="header-title">claude-usage</div>
      <div class="header-subtitle" id="subtitle"></div>
    </div>
  </div>

  <div class="content">
    <div class="gauges">
      <div class="gauges-title" id="gauges-title">Usage</div>
      <div id="gauge-list"></div>
    </div>

    <div id="status" class="status-bar">
      <div class="status-dot"></div>
      <span class="status-text" id="status-text"></span>
    </div>

    <div id="delivery" class="delivery" hidden>
      <span class="delivery-dot"></span>
      <span id="delivery-text"></span>
    </div>

    <div class="btn-row">
      <button id="sync-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span id="sync-label"></span>
      </button>
      <button id="login-btn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span id="login-label"></span>
      </button>
    </div>

    <div class="footer">
      <div class="path-line" id="output-path"></div>
      <div class="footer-links">
        <button class="link" id="config-btn"></button>
        <button class="link danger" id="quit-btn"></button>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
