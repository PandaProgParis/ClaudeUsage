<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- The panel is entirely local: no remote script, style, image or fetch. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Claude Usage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow: hidden; }

    /* Author display rules below would otherwise beat the browser's own [hidden] rule. */
    [hidden] { display: none !important; }

    body {
      width: 320px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      border: 1px solid #e5e2de;
      border-radius: 10px;
      user-select: none;
      /* Frameless window: the whole panel is a drag handle, except its controls. */
      -webkit-app-region: drag;
    }

    button { -webkit-app-region: no-drag; }

    /* Top line of the card: last reading on the left, controls on the right */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: -3px -5px -2px 0;
    }

    .headline {
      font-size: 10.5px;
      color: #8b8580;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 5px;
      background: none;
      color: #b0aca6;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: #f0eeeb; color: #1a1a1a; }
    .icon-btn.danger:hover { color: #d94444; }

    .icon-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn.spinning { color: #d97757; }
    .icon-btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Content */
    .content {
      padding: 7px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* No account: the panel is sized to its content, so reaching the window's
       own minimum height (140px, see resizePanel) is what actually pins the
       footer to the bottom edge instead of leaving a gap under it. */
    .content.empty { min-height: 140px; }
    .content.empty #account-list { flex: 1; }
    .content.empty .account.pending { flex: 1; }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .empty-title { font-size: 11.5px; font-weight: 500; color: #5c5650; text-align: center; }
    .empty-state .btn { padding: 7px 14px; }

    /* A pending block stacked under real accounts keeps its own breathing room. */
    .account.pending .empty-state { padding: 8px 0 2px; }

    /* Gauges - spacing comes from the .account block that holds them */
    .gauge { display: flex; flex-direction: column; gap: 1px; line-height: 1.25; }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gauge-label { font-size: 10.5px; font-weight: 500; color: #5c5650; }
    .gauge-reset { font-size: 9.5px; color: #b0aca6; }

    .gauge-row { display: flex; align-items: center; gap: 8px; }

    .gauge-track {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #f0eeeb;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .gauge-value {
      font-size: 10.5px;
      font-weight: 600;
      min-width: 30px;
      text-align: right;
    }

    /* A full quota, in the panel's error red. The bar itself keeps the model's
       colour - repainting it would cost the only cue that tells Fable from
       All models at a glance. */
    .gauge-value.exhausted,
    .account-summary .exhausted { color: #d94444; }

    .gauges-empty {
      font-size: 11px;
      color: #b0aca6;
      text-align: center;
      padding: 6px 0;
    }

    /* Accounts */
    #account-list { display: flex; flex-direction: column; gap: 6px; }

    .account { display: flex; flex-direction: column; gap: 5px; }

    /* Separator between stacked accounts, never above the first one */
    .account + .account { padding-top: 6px; border-top: 1px solid #f0eeeb; }

    /* A row, not a button: the remove button lives on it, and a button cannot
       be nested inside another one. */
    .account-head { display: flex; align-items: center; gap: 6px; }

    .account-switch {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0; /* lets the name ellipsis instead of pushing the button out */
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      text-align: left;
      cursor: default;
    }

    /* Only a block you can switch to invites a click. */
    .account-switch[data-action] { cursor: pointer; }

    .account-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ddd9d4;
      flex-shrink: 0;
    }

    /* The account being read right now: green, so the panel says which session
       is live without a word. It breathes three times when a push lands (every
       render rebuilds the dot), then rests. An endless box-shadow pulse repaints
       on every display frame for as long as the panel is on screen, and the
       panel stays open on blur: measured at about a quarter of a core. */
    .account.active .account-dot {
      background: #3fa65f;
      animation: account-pulse 2.4s ease-in-out 3;
    }

    @keyframes account-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(63, 166, 95, 0.55); }
      50% { box-shadow: 0 0 0 4px rgba(63, 166, 95, 0); }
    }

    /* A pulse is decoration; it must not fight someone who asked for stillness. */
    @media (prefers-reduced-motion: reduce) {
      .account.active .account-dot { animation: none; }
    }

    .account-name {
      font-size: 11px;
      font-weight: 600;
      color: #5c5650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-switch[data-action]:hover .account-name { color: #1a1a1a; }

    .account-summary {
      margin-left: auto;
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 10px;
      color: #b0aca6;
      white-space: nowrap;
      flex-shrink: 0;
      padding-left: 6px;
    }

    /* When the account is usable again. First, because it is the reason the
       collapsed line is worth reading at all once a quota is full. */
    .summary-countdown {
      color: #8b8580;
      font-variant-numeric: tabular-nums;
    }

    .summary-countdown::after {
      content: '·';
      margin-left: 3px;
      color: #ccc7c1;
    }

    .summary-sep { color: #ccc7c1; }

    .account-remove {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      border-radius: 5px;
      background: none;
      color: #ccc7c1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .account-remove:hover { background: #fceeed; color: #d94444; }

    .account-remove svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Status pill - only shown when something needs the user */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #f0eeeb;
    }

    .status-bar.error { background: #fceeed; }
    .status-bar.login { background: #fef4e8; }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .status-bar.error .status-dot { background: #d94444; }
    .status-bar.login .status-dot { background: #d9952a; }

    .status-text {
      font-size: 12px;
      color: #5c5650;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    /* Delivery line */
    .delivery {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: #8b8580;
      padding: 0 2px;
      overflow-wrap: anywhere;
    }

    .delivery-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b0aca6;
      flex-shrink: 0;
    }

    .delivery.ok .delivery-dot { background: #4a9e4a; }
    .delivery.error { color: #c0483f; }
    .delivery.error .delivery-dot { background: #d94444; }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      border: 1px solid #ddd9d4;
      background: #fff;
      color: #5c5650;
    }

    .btn-secondary:hover { border-color: #d97757; color: #d97757; }

    .btn-danger {
      border: 1px solid #f0cfcc;
      background: #fceeed;
      color: #c0483f;
    }

    .btn-danger:hover { border-color: #d94444; background: #f9e2e0; }

    /* The delete question takes the gauges' place, so it keeps their width. */
    .confirm-row { display: flex; gap: 6px; }
    .confirm-row .btn { flex: 1; }

    .btn svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer */
    .footer-links {
      display: flex;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid #f0eeeb;
    }

    /* With no account the add link moves to the middle of the panel, so Quit is
       alone on the bar and keeps its usual right-hand place. */
    .content.empty .footer-links { margin-top: auto; justify-content: flex-end; }

    .link {
      color: #b0aca6;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 10.5px;
      padding: 0;
    }

    .link:hover { color: #1a1a1a; }
    .link.danger:hover { color: #d94444; }
  </style>
</head>
<body>
  <div class="content" id="content">
    <div class="card-head">
      <span class="headline" id="headline"></span>
      <div class="header-actions">
        <button id="settings-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="sync-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button id="minimize-btn" class="icon-btn">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- One block per account, built by panel.js: the status pill, the reconnect
         button and the delivery line all live inside the block they belong to. -->
    <div id="account-list"></div>

    <div class="footer-links">
      <button class="link" id="add-account-btn"></button>
      <button class="link" id="quit-btn"></button>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
