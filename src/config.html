<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Same rule as the panel: nothing remote, ever. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <!-- No <title>: a document title would override the translated one main.js gives the window. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow: hidden; }

    [hidden] { display: none !important; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #faf9f7;
      padding: 16px 18px 18px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #5c5650;
    }

    input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ddd9d4;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus { border-color: #d97757; box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15); }
    input.invalid { border-color: #d94444; }

    #interval { width: 110px; }

    /* A checkbox reads as one line, label beside the box, not above it. */
    .field-check { flex-direction: row; align-items: center; gap: 8px; }
    .field-check input { width: auto; margin: 0; }
    .field-check label { font-weight: 600; }

    .hint {
      font-size: 11px;
      color: #8b8580;
      line-height: 1.4;
    }

    .error {
      font-size: 11px;
      color: #c0483f;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 4px;
    }

    .btn {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .btn-primary {
      border: none;
      background: #d97757;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: #c96a4d; }

    .btn-secondary {
      border: 1px solid #ddd9d4;
      background: #fff;
      color: #5c5650;
    }

    .btn-secondary:hover { border-color: #d97757; color: #d97757; }
  </style>
</head>
<body>
  <form id="form" novalidate>
    <div class="field">
      <label for="endpoint" id="endpoint-label"></label>
      <input id="endpoint" type="url" placeholder="https://" spellcheck="false" autocomplete="off">
      <div class="hint" id="endpoint-hint"></div>
      <div class="error" id="endpoint-error" hidden></div>
    </div>

    <div class="field">
      <label for="interval" id="interval-label"></label>
      <input id="interval" type="number" min="1" max="1440" step="1" autocomplete="off">
      <div class="hint" id="interval-hint"></div>
      <div class="error" id="interval-error" hidden></div>
    </div>

    <div class="field">
      <label for="output-path" id="output-path-label"></label>
      <input id="output-path" type="text" spellcheck="false" autocomplete="off">
      <div class="hint" id="output-path-hint"></div>
      <div class="error" id="output-path-error" hidden></div>
    </div>

    <div class="field">
      <div class="field field-check">
        <input id="expand-all" type="checkbox">
        <label for="expand-all" id="expand-all-label"></label>
      </div>
      <div class="hint" id="expand-all-hint"></div>
    </div>

    <div class="error" id="form-error" hidden></div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" id="cancel-btn"></button>
      <button type="submit" class="btn btn-primary" id="save-btn"></button>
    </div>
  </form>

  <script src="config.js"></script>
</body>
</html>
